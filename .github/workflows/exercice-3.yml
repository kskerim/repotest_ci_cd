name: exercice 3 - construire, tester et déployer

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: environnement de déploiement
        type: choice
        options:
          - staging
          - production

# les jobs peuvent juste lire le dépôt
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: npm ci
      - run: npm run build
      - name: publier dist
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environnement }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: echo "deploy to ${{ vars.API_URL }}"
      - name: résumé
        run: |
          echo "## déploiement" >> $GITHUB_STEP_SUMMARY
          echo "cible : ${{ inputs.environnement }}" >> $GITHUB_STEP_SUMMARY
          echo "url : ${{ vars.API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
