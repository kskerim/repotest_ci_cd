name: exercice 3 - construire, tester et déployer

on:
  workflow_dispatch:
    inputs:
      target:
        description: environnement à déployer
        required: true
        type: choice
        options: [staging, production]

# les jobs peuvent juste lire le dépôt
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.API_URL }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: simuler le déploiement
        run: echo "déploiement vers ${{ vars.API_URL }}"

      - name: produire le résumé
        shell: bash
        run: |
          echo "## déploiement" >> "$GITHUB_STEP_SUMMARY"
          echo "- environnement : ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- url : ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
